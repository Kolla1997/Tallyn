<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 9 340 340" role="img" aria-label="Coinroof"><title>Coinroof</title><style>
@keyframes pop{from{transform:scale(.6);opacity:0;transform-origin:128px 128px}to{transform:scale(1);opacity:1;transform-origin:128px 128px}}
@keyframes grow{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
@keyframes sweepall{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{transform:translateY(160px);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(-240px);opacity:0}}
@keyframes glint{0%,70%,100%{opacity:1}35%{opacity:.55}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035)}}
.tile{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.frame{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
.arc{transform-origin:261px -5px;animation:grow .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i)*.12s)}
.stripe{animation:slide .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.05s + var(--j)*.07s)}
.ltr{animation:rise .4s ease-out both;animation-delay:calc(1.5s + var(--k)*.06s)}
.arc{animation:grow .55s cubic-bezier(.2,.8,.2,1) both, glint 2.4s ease-in-out infinite;animation-delay:calc(.25s + var(--i)*.12s),calc(2.8s + var(--i)*.14s)}
</style><defs><clipPath id="mlight-in"><rect x="9" y="9" width="238" height="238" rx="37"/></clipPath><clipPath id="mlight-out"><path clip-rule="evenodd" d="M-64 -64 H320 V320 H-64 Z M-0.75 -5 a261.75 261.75 0 1 0 523.5 0 a261.75 261.75 0 1 0 -523.5 0 Z"/></clipPath></defs><g transform="translate(15,15) scale(1.28125)"><g class="tile"><rect class="frame" x="3" y="3" width="250" height="250" rx="43" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="6"/><g clip-path="url(#mlight-in)"><g class="arcs"><path class="arc" style="--i:0" fill="#067B00" fill-rule="evenodd" d="M203.25 -5 a57.75 57.75 0 1 0 115.5 0 a57.75 57.75 0 1 0 -115.5 0 Z M222 -5 a39 39 0 1 0 78 0 a39 39 0 1 0 -78 0 Z"/><path class="arc" style="--i:1" fill="#067B00" fill-rule="evenodd" d="M169.25 -5 a91.75 91.75 0 1 0 183.5 0 a91.75 91.75 0 1 0 -183.5 0 Z M188.0 -5 a73.0 73.0 0 1 0 146.0 0 a73.0 73.0 0 1 0 -146.0 0 Z"/><path class="arc" style="--i:2" fill="#067B00" fill-rule="evenodd" d="M135.25 -5 a125.75 125.75 0 1 0 251.5 0 a125.75 125.75 0 1 0 -251.5 0 Z M154.0 -5 a107.0 107.0 0 1 0 214.0 0 a107.0 107.0 0 1 0 -214.0 0 Z"/><path class="arc" style="--i:3" fill="#CB0900" fill-rule="evenodd" d="M101.25 -5 a159.75 159.75 0 1 0 319.5 0 a159.75 159.75 0 1 0 -319.5 0 Z M120.0 -5 a141.0 141.0 0 1 0 282.0 0 a141.0 141.0 0 1 0 -282.0 0 Z"/><path class="arc" style="--i:4" fill="#CB0900" fill-rule="evenodd" d="M67.25 -5 a193.75 193.75 0 1 0 387.5 0 a193.75 193.75 0 1 0 -387.5 0 Z M86.0 -5 a175.0 175.0 0 1 0 350.0 0 a175.0 175.0 0 1 0 -350.0 0 Z"/><path class="arc" style="--i:5" fill="#067B00" fill-rule="evenodd" d="M33.25 -5 a227.75 227.75 0 1 0 455.5 0 a227.75 227.75 0 1 0 -455.5 0 Z M52.0 -5 a209.0 209.0 0 1 0 418.0 0 a209.0 209.0 0 1 0 -418.0 0 Z"/><path class="arc" style="--i:6" fill="#067B00" fill-rule="evenodd" d="M-0.75 -5 a261.75 261.75 0 1 0 523.5 0 a261.75 261.75 0 1 0 -523.5 0 Z M18.0 -5 a243.0 243.0 0 1 0 486.0 0 a243.0 243.0 0 1 0 -486.0 0 Z"/></g><g clip-path="url(#mlight-out)"><g class="stripes"><rect class="stripe" style="--j:8" x="0" y="-33.50" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:7" x="0" y="0.25" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:6" x="0" y="34.00" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:5" x="0" y="67.75" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:4" x="0" y="101.50" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:3" x="0" y="135.25" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:2" x="0" y="169.00" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:1" x="0" y="202.75" width="256" height="18.5" fill="#067B00"/><rect class="stripe" style="--j:0" x="0" y="236.50" width="256" height="18.5" fill="#067B00"/></g></g></g></g></g></svg>