name: Bug
description: Report something broken
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Device, browser, version
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p2 - nice to have, p1 - important, p0 - urgent]
