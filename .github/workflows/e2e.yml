# Browser end-to-end tests (#113): the P0 paths through the real app, Go API,
# the Supabase project just for tests and the Plaid sandbox. Weekly (#1, to save Actions minutes), and by
# hand before each release (Actions → "End-to-end" → Run workflow). Never on
# pull requests, so the test keys can't reach code from a fork.
# Keys come from repository secrets (E2E_*), listed in docs/04 Tech/Dev Setup.md.
name: End-to-end

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: P0 paths (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_DATABASE_URL_SYNC: ${{ secrets.E2E_DATABASE_URL_SYNC }}
      E2E_PLAID_CLIENT_ID: ${{ secrets.E2E_PLAID_CLIENT_ID }}
      E2E_PLAID_SECRET: ${{ secrets.E2E_PLAID_SECRET }}
      E2E_TOKEN_ENCRYPTION_KEY: ${{ secrets.E2E_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # supabase-js in the test runner needs Node's built-in WebSocket (Node 22+)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Keep screenshots and traces of what broke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report-e2e
            web/test-results-e2e
          retention-days: 14
