# Checks on every pull request and on main (#100): Go formatting, vet and
# tests (with a throwaway Postgres for the schema and row-level security
# tests), and the web app's lint, formatting, tests and build. A PR shows a
# tick or a cross before it's merged. No secrets and no passwords here.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (format, vet, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway database for this run only: no password at all, so
          # nothing here looks like a secret (GitGuardian, #100).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TALLYN_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  web:
    name: Web (lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
